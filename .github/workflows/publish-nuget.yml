name: Publish SocketJack.Ftdi

on:
  workflow_dispatch:

concurrency:
  group: publish-nuget
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.repository == 'hheiroww/SocketJack.Ftdi' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Pack the portable tool
        run: >
          dotnet pack src/SocketJack.Ftdi -c Release
          -p:ContinuousIntegrationBuild=true -p:DebugType=none
          -p:RepositoryCommit=${{ github.sha }} -o artifacts/packages
      - name: Install and exercise the exact package
        shell: bash
        run: |
          package=(artifacts/packages/SocketJack.Ftdi.*.nupkg)
          [[ "${#package[@]}" -eq 1 && -f "${package[0]}" ]]
          version="${package[0]##*/SocketJack.Ftdi.}"
          dotnet tool install --tool-path artifacts/tool --source artifacts/packages SocketJack.Ftdi --version "${version%.nupkg}"
          artifacts/tool/socketjack-ftdi --help | grep -F 'SocketJack.Ftdi'
          artifacts/tool/socketjack-ftdi ports
      - name: Preserve verified package
        uses: actions/upload-artifact@v7
        with:
          name: SocketJack.Ftdi
          path: artifacts/packages/SocketJack.Ftdi.*.nupkg
          if-no-files-found: error
      - name: Authenticate to NuGet.org
        id: nuget
        uses: NuGet/login@v1
        with:
          user: Pathogenix
      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: dotnet nuget push artifacts/packages/SocketJack.Ftdi.*.nupkg --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY"
